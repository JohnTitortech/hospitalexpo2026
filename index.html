<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booth Monitoring Dashboard - IIHE 2026</title>
<style>
:root{
  --navy:#0f2942;--blue:#1565c0;--blue-light:#e8f1fb;--accent:#00a99d;
  --bg:#f4f6f8;--card-bg:#ffffff;--text:#1c2b36;--muted:#6b7c88;
  --danger:#c0392b;--border:#e0e6ea;--radius:10px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}

/* HEADER */
.app-header{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:22px 16px;text-align:center;}
.header-inner h1{margin:0 0 6px;font-size:18px;line-height:1.3;}
.event-date{margin:0;font-size:13px;opacity:.9;}
.subtitle{margin:6px 0 0;font-size:14px;font-weight:600;letter-spacing:1px;}

/* TABS */
.tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;}
.tab-btn{flex:1;min-width:90px;padding:14px 10px;border:none;background:none;font-size:13px;font-weight:600;letter-spacing:.5px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue);}

main{max-width:1000px;margin:0 auto;padding:20px 16px 60px;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}
.panel-title{margin:0 0 16px;font-size:18px;}

/* NO DATA */
.no-data{background:#fff;border:1px dashed var(--border);border-radius:var(--radius);padding:30px 16px;text-align:center;color:var(--muted);}
.no-data .btn{margin-top:12px;}

/* FORM */
.form-box{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:24px;}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;}
.field input{width:100%;padding:10px;font-size:16px;border:1px solid var(--border);border-radius:6px;}
.field input.invalid{border-color:var(--danger);}
.field .error{font-size:11px;color:var(--danger);min-height:14px;display:block;}
.form-actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border:none;border-radius:8px;font-size:13px;font-weight:700;letter-spacing:.5px;cursor:pointer;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-secondary{background:var(--blue-light);color:var(--blue);}
.btn-danger{background:#fdecea;color:var(--danger);}

/* CHARTS */
.chart-box{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px 16px 8px;margin-bottom:18px;}
.chart-box h3{margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:.8px;color:var(--navy);text-transform:uppercase;}
.chart-box-main{padding:20px 18px 10px;}
.chart-box-main h3{font-size:16px;}
.chart-canvas-wrap{position:relative;height:240px;}
.chart-canvas-wrap-main{height:320px;}
.chart-canvas-wrap canvas{width:100%!important;height:100%!important;}
.chart-row-2col{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media (max-width:700px){
  .chart-row-2col{grid-template-columns:1fr;}
  .chart-canvas-wrap-main{height:260px;}
}

/* metric strip */
.metric-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:16px 0 4px;}
.metric-card{background:#fff;border-radius:14px;padding:16px;text-align:center;box-shadow:0 1px 3px rgba(20,30,50,.08),0 1px 2px rgba(20,30,50,.05);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:200px;}
.metric-card .metric-label{font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;margin-bottom:auto;}
.metric-card .metric-value{font-size:34px;font-weight:800;color:var(--navy);line-height:1;}
.metric-card .metric-day{font-size:11px;font-weight:600;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;margin-top:auto;}
.metric-card .follower-list{display:flex;flex-direction:column;justify-content:center;gap:8px;text-align:left;width:100%;}
.follower-list .follower-row{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--navy);border-bottom:1px dashed #dde3ea;padding-bottom:7px;}
.follower-list .follower-row.total{border-bottom:none;font-weight:800;margin-top:2px;}
@media (max-width:900px){.metric-strip{grid-template-columns:repeat(2,1fr);}}
@media (max-width:480px){.metric-strip{grid-template-columns:1fr;}}

.summary-numbers{margin:6px 0 20px;}

/* photo strip */
.photo-strip{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 16px;}
.photo-slot{flex:1 1 150px;aspect-ratio:4/3;border-radius:8px;overflow:hidden;position:relative;background:var(--blue-light,#eef3fb);border:1px solid #dbe4ee;}
.photo-thumb{width:100%;height:100%;object-fit:cover;cursor:pointer;display:block;}
.photo-remove{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;width:22px;height:22px;line-height:22px;text-align:center;font-size:12px;cursor:pointer;}
.photo-remove:hover{background:rgba(0,0,0,.8);}
.photo-upload-btn{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;padding:8px;}
.photo-upload-btn:hover{color:var(--navy);}
.photo-uploading{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);}
@media (max-width:700px){.photo-slot{flex:1 1 100%;}}
.day-view-bar{display:flex;justify-content:flex-end;margin:2px 0 0;}
.day-view-select{padding:4px 8px;font-size:12px;font-weight:700;letter-spacing:.5px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--navy);cursor:pointer;}
.highlight-box{margin:0 0 16px;}
.highlight-box label{display:block;font-size:12px;font-weight:800;letter-spacing:.8px;color:var(--navy);text-transform:uppercase;margin-bottom:6px;}
.highlight-box textarea{width:100%;min-height:90px;padding:10px;font-size:16px;font-family:inherit;line-height:1.4;border:1px solid var(--border);border-radius:8px;resize:vertical;background:#fff;color:var(--text);}
.highlight-box .btn{margin-top:8px;padding:8px 14px;font-size:12px;}
.photo-day-title{margin:12px 0 6px;font-size:13px;color:var(--navy);letter-spacing:.5px;}

.day-panel-header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:14px;}

.edit-panel{margin-top:6px;}
.edit-panel summary{cursor:pointer;font-weight:700;font-size:13px;letter-spacing:.5px;color:var(--blue);padding:10px 0;}
.edit-panel-hint{margin:0 0 16px;font-size:12px;color:var(--muted);}
.day-form-section{padding:16px 0;border-top:1px solid var(--border);}
.day-form-section:first-of-type{border-top:none;padding-top:0;}
.day-form-section-header{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;}
.day-form-section-header h4{margin:0;font-size:13px;font-weight:800;letter-spacing:.8px;color:var(--navy);}
.day-form-section-date{font-size:11px;color:var(--muted);}
.day-form-section--filled .day-form-section-header h4::after{content:"✓";margin-left:6px;color:var(--accent);font-weight:700;}

.no-data-inline{background:#fff;border:1px dashed var(--border);border-radius:var(--radius);padding:16px;text-align:center;color:var(--muted);font-size:13px;margin-bottom:16px;}
.data-tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal-overlay.active{display:flex;}
.modal-box{background:#fff;border-radius:var(--radius);padding:24px;max-width:340px;text-align:center;}
.modal-warning{color:var(--danger);font-size:13px;}
.modal-actions{display:flex;gap:10px;justify-content:center;margin-top:16px;}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.demo-badge{display:inline-block;background:#fff3cd;color:#8a6d1a;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;margin-bottom:12px;letter-spacing:.5px;}

@media (min-width:700px){.header-inner h1{font-size:22px;}}
</style>

<!-- Firebase (Firestore) — hanya untuk sinkronisasi data & URL foto antar device -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<!-- Chart.js + datalabels (sebelumnya di-inline, sekarang dari cdnjs) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <h1>THE 38th INDONESIA INTERNATIONAL HOSPITAL EXPO 2026</h1>
    <p class="event-date">7–10 OCTOBER 2026</p>
    <p class="subtitle">BOOTH MONITORING DASHBOARD</p>
  </div>
</header>

<main id="app">

  <!-- INPUT DATA (Day 1-4) -->
  <section class="tab-panel active" id="panel-day4" data-day="day4"></section>

  <!-- Export / Import / Reset (dipindah dari halaman Summary) -->
  <div class="data-tools">
    <button id="btnExport" class="btn btn-secondary">EXPORT DATA</button>
    <label class="btn btn-secondary" for="importFile">IMPORT DATA
      <input type="file" id="importFile" accept=".csv,.json" hidden>
    </label>
    <button id="btnReset" class="btn btn-danger">RESET DATA</button>
  </div>

</main>

<!-- Reset confirmation modal -->
<div class="modal-overlay" id="resetModal">
  <div class="modal-box">
    <p>Are you sure you want to reset all event data?</p>
    <p class="modal-warning">This action cannot be undone.</p>
    <div class="modal-actions">
      <button id="btnCancelReset" class="btn btn-secondary">CANCEL</button>
      <button id="btnConfirmReset" class="btn btn-danger">RESET</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
/* ============================================================
   BOOTH MONITORING DASHBOARD - IIHE 2026
   Vanilla JS. Data model lives in localStorage (+ Firestore sync).
   ============================================================ */

const STORAGE_KEY = 'iihe2026_data';
const DEMO_FLAG_KEY = 'iihe2026_isDemo';

const DAYS = [
  { id: 'day1', label: 'DAY 1', date: '2026-10-07', dateLabel: '7 OCTOBER 2026' },
  { id: 'day2', label: 'DAY 2', date: '2026-10-08', dateLabel: '8 OCTOBER 2026' },
  { id: 'day3', label: 'DAY 3', date: '2026-10-09', dateLabel: '9 OCTOBER 2026' },
  { id: 'day4', label: 'DAY 4', date: '2026-10-10', dateLabel: '10 OCTOBER 2026' },
];

const INPUT_TAB = 'day4'; // panel input untuk semua hari

const FIELDS = [
  { key: 'visitor',   label: 'Booth Visitor' },
  { key: 'ig',        label: 'Instagram' },
  { key: 'tiktok',    label: 'TikTok' },
  { key: 'fb',        label: 'Facebook' },
  { key: 'buyer',     label: 'Serious Buyer' },
  { key: 'challenge', label: 'Challenge Story' },
];

const DEMO_DATA = {
  day1: { visitor: 89,  ig: 12, tiktok: 8,  fb: 4, buyer: 7,  challenge: 23 },
  day2: { visitor: 110, ig: 15, tiktok: 10, fb: 5, buyer: 9,  challenge: 31 },
  day3: { visitor: 135, ig: 20, tiktok: 14, fb: 7, buyer: 12, challenge: 40 },
  day4: { visitor: 120, ig: 18, tiktok: 11, fb: 6, buyer: 10, challenge: 35 },
};

let charts = {};

const LIBS_OK = (typeof Chart !== 'undefined');
if (LIBS_OK && typeof ChartDataLabels !== 'undefined') {
  Chart.register(ChartDataLabels);
}

const COLOR_VISITOR = '#1565c0';
const COLOR_BUYER = '#00a99d';
const COLOR_CHALLENGE = '#0f2942';
const COLOR_IG = '#c2185b';
const COLOR_TIKTOK = '#0f2942';
const COLOR_FB = '#1565c0';

/* ---------------- CLOUDINARY (photo upload) ---------------- */
const CLOUDINARY_CLOUD_NAME = 'dr9ub0xal';
const CLOUDINARY_UPLOAD_PRESET = 'booth_photos';
const CLOUDINARY_FOLDER = 'iihe2026-booth-photos';

/* ---------------- FIREBASE (Firestore) ---------------- */
const firebaseConfig = {
  apiKey:            "AIzaSyAnVNWQW3dxEJZlQVmprtBt2_Kc6IXu9HM",
  authDomain:        "hospitalexpo2026.firebaseapp.com",
  projectId:         "hospitalexpo2026",
  storageBucket:     "hospitalexpo2026.firebasestorage.app",
  messagingSenderId: "176852630651",
  appId:             "1:176852630651:web:7ef750c5c5d8872cfa36de"
};

const FIREBASE_OK = (typeof firebase !== 'undefined') &&
  firebaseConfig.apiKey && firebaseConfig.apiKey !== 'YOUR_API_KEY';

let db = null;
if (FIREBASE_OK) {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
}

const PHOTOS_COLLECTION = 'BOOTH_PHOTOS';
const DATA_COLLECTION = 'BOOTH_DATA';

async function loadPhotosFromFirestore() {
  if (!FIREBASE_OK) return;
  try {
    const snap = await db.collection(PHOTOS_COLLECTION).get();
    snap.forEach(doc => {
      const dayId = doc.id;
      const photos = doc.data().photos;
      if (DATA[dayId] && Array.isArray(photos)) DATA[dayId].photos = photos;
    });
  } catch (err) {
    console.error('Gagal memuat foto dari Firestore:', err);
  }
}

async function savePhotosToFirestore(dayId) {
  if (!FIREBASE_OK) return;
  try {
    const photos = (DATA[dayId] && DATA[dayId].photos) || [null, null, null];
    await db.collection(PHOTOS_COLLECTION).doc(dayId).set({ photos }, { merge: true });
  } catch (err) {
    console.error('Gagal menyimpan foto ke Firestore:', err);
    showToast('Foto tersimpan lokal, tapi gagal sync ke Firestore');
  }
}

async function loadDataFromFirestore() {
  if (!FIREBASE_OK) return;
  try {
    const snap = await db.collection(DATA_COLLECTION).get();
    let hasRemote = false;
    snap.forEach(doc => {
      const dayId = doc.id;
      if (!DAYS.some(d => d.id === dayId)) return;
      const d = doc.data();
      const photos = (DATA[dayId] && DATA[dayId].photos) || [null, null, null];
      const localHighlight = (DATA[dayId] && DATA[dayId].highlight) || '';
      DATA[dayId] = {
        visitor: Number(d.visitor) || 0,
        ig: Number(d.ig) || 0,
        tiktok: Number(d.tiktok) || 0,
        fb: Number(d.fb) || 0,
        buyer: Number(d.buyer) || 0,
        challenge: Number(d.challenge) || 0,
        photos,
        highlight: typeof d.highlight === 'string' ? d.highlight : localHighlight,
      };
      hasRemote = true;
    });
    if (hasRemote) {
      clearDemoFlag();
      saveData(DATA);
    }
  } catch (err) {
    console.error('Gagal memuat data dari Firestore:', err);
  }
}

async function saveDayToFirestore(dayId) {
  if (!FIREBASE_OK) return;
  try {
    const r = DATA[dayId];
    if (!r) return;
    await db.collection(DATA_COLLECTION).doc(dayId).set({
      visitor: r.visitor, ig: r.ig, tiktok: r.tiktok,
      fb: r.fb, buyer: r.buyer, challenge: r.challenge,
      highlight: r.highlight || '',
    }, { merge: true });
  } catch (err) {
    console.error('Gagal menyimpan data ke Firestore:', err);
    showToast('Data tersimpan lokal, tapi gagal sync ke Firestore');
  }
}

async function clearFirestoreData() {
  if (!FIREBASE_OK) return;
  try {
    const batch = db.batch();
    DAYS.forEach(d => {
      batch.delete(db.collection(DATA_COLLECTION).doc(d.id));
      batch.delete(db.collection(PHOTOS_COLLECTION).doc(d.id));
    });
    await batch.commit();
  } catch (err) {
    console.error('Gagal menghapus data di Firestore:', err);
    showToast('Reset lokal berhasil, tapi gagal hapus data di Firestore');
  }
}

/* ---------------- DATA LAYER ---------------- */

function loadData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    try { return JSON.parse(raw); } catch (e) { /* fall through to seed */ }
  }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DEMO_DATA));
  localStorage.setItem(DEMO_FLAG_KEY, 'true');
  return JSON.parse(JSON.stringify(DEMO_DATA));
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function isDemoMode() {
  return localStorage.getItem(DEMO_FLAG_KEY) === 'true';
}

function clearDemoFlag() {
  localStorage.removeItem(DEMO_FLAG_KEY);
}

let DATA = loadData();

function totalFollower(day) {
  return (day.ig || 0) + (day.tiktok || 0) + (day.fb || 0);
}

/* ---------------- SUPPORTING NUMBERS ---------------- */

function metricStripHtml(record, dayLabel) {
  if (!record) return '';
  const dayTag = dayLabel ? `<div class="metric-day">${dayLabel}</div>` : '';
  return `
    <div class="metric-strip">
      <div class="metric-card">
        <div class="metric-label">Booth Visitor</div>
        <div class="metric-value">${record.visitor}</div>
        ${dayTag}
      </div>
      <div class="metric-card">
        <div class="metric-label">Follower Up</div>
        <div class="follower-list">
          <div class="follower-row"><span>Instagram</span><span>${record.ig}</span></div>
          <div class="follower-row"><span>TikTok</span><span>${record.tiktok}</span></div>
          <div class="follower-row"><span>Facebook</span><span>${record.fb}</span></div>
          <div class="follower-row total"><span>Total</span><span>${totalFollower(record)}</span></div>
        </div>
        ${dayTag}
      </div>
      <div class="metric-card">
        <div class="metric-label">Serious Buyer</div>
        <div class="metric-value">${record.buyer}</div>
        ${dayTag}
      </div>
      <div class="metric-card">
        <div class="metric-label">Challenge Story</div>
        <div class="metric-value">${record.challenge}</div>
        ${dayTag}
      </div>
    </div>`;
}

/* ---------------- PHOTO STRIP (Cloudinary upload) ---------------- */

async function uploadImageToCloudinary(file) {
  if (!CLOUDINARY_CLOUD_NAME || CLOUDINARY_CLOUD_NAME === 'YOUR_CLOUD_NAME' ||
      !CLOUDINARY_UPLOAD_PRESET || CLOUDINARY_UPLOAD_PRESET === 'YOUR_UPLOAD_PRESET') {
    throw new Error('Cloudinary belum dikonfigurasi. Isi CLOUDINARY_CLOUD_NAME dan CLOUDINARY_UPLOAD_PRESET.');
  }
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
  formData.append('folder', CLOUDINARY_FOLDER);

  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
    method: 'POST', body: formData
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || `Upload gagal (${res.status})`);
  }
  const data = await res.json();
  return data.secure_url;
}

/* Strip foto dikenali lewat data-photo-day (bukan id), karena strip yang sama
   bisa tampil di dua tempat sekaligus (tab TODAY dan tab INPUT DATA). */
function photoStripHtml(dayId, record) {
  if (!record) return '';
  const photos = record.photos || [null, null, null];
  return `
    <div class="photo-strip" data-photo-day="${dayId}">
      ${[0, 1, 2].map(i => photoSlotHtml(dayId, i, photos[i])).join('')}
    </div>`;
}

function photoSlotHtml(dayId, idx, url) {
  return `
    <div class="photo-slot">
      ${url ? `
        <img src="${url}" alt="Foto ${idx + 1}" class="photo-thumb" onclick="window.open('${url}','_blank')">
        <button type="button" class="photo-remove" title="Hapus foto" onclick="removePhoto('${dayId}', ${idx})">✕</button>
      ` : `
        <label class="photo-upload-btn">
          📷 Upload Foto ${idx + 1}
          <input type="file" accept="image/*" style="display:none" onchange="handlePhotoUpload(event, '${dayId}', ${idx})">
        </label>
      `}
    </div>`;
}

/** Render ulang semua strip foto milik satu hari (di semua tab yang menampilkannya). */
function refreshPhotoStrips(dayId) {
  const photos = (DATA[dayId] && DATA[dayId].photos) || [null, null, null];
  document.querySelectorAll(`.photo-strip[data-photo-day="${dayId}"]`).forEach(strip => {
    strip.innerHTML = [0, 1, 2].map(i => photoSlotHtml(dayId, i, photos[i])).join('');
  });
}

async function handlePhotoUpload(event, dayId, idx) {
  const file = event.target.files[0];
  if (!file) return;
  const slotEl = event.target.closest('.photo-slot');
  if (slotEl) slotEl.innerHTML = `<div class="photo-uploading">⏳ Uploading...</div>`;

  try {
    const url = await uploadImageToCloudinary(file);
    if (!DATA[dayId]) DATA[dayId] = {};
    if (!DATA[dayId].photos) DATA[dayId].photos = [null, null, null];
    DATA[dayId].photos[idx] = url;
    saveData(DATA);
    savePhotosToFirestore(dayId);
    refreshPhotoStrips(dayId);
    showToast('Foto berhasil diupload');
  } catch (err) {
    showToast(err.message || 'Upload foto gagal');
    refreshPhotoStrips(dayId);
  }
}

function removePhoto(dayId, idx) {
  if (!confirm('Hapus foto ini?')) return;
  if (DATA[dayId] && DATA[dayId].photos) {
    DATA[dayId].photos[idx] = null;
    saveData(DATA);
    savePhotosToFirestore(dayId);
  }
  refreshPhotoStrips(dayId);
}

/* ---------------- DAY VIEW (dropdown Day 1-4: angka + 3 foto) ---------------- */

let selectedViewDay = null;

/** Default: hari terakhir yang sudah ada datanya, kalau belum ada -> Day 1. */
function getViewDay() {
  if (selectedViewDay && DAYS.some(d => d.id === selectedViewDay)) return selectedViewDay;
  const filled = DAYS.filter(d => DATA[d.id]);
  return filled.length ? filled[filled.length - 1].id : DAYS[0].id;
}

function escapeHtml(str) {
  return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/** Satu kolom highlight di bawah 3 foto, lebarnya mengikuti lebar strip foto. */
function highlightHtml(dayId, rec) {
  return `
    <div class="highlight-box">
      <label for="highlight-${dayId}">Highlight</label>
      <textarea id="highlight-${dayId}" placeholder="Tulis highlight hari ini...">${escapeHtml(rec.highlight)}</textarea>
      <button type="button" class="btn btn-secondary" onclick="saveHighlight('${dayId}')">SIMPAN HIGHLIGHT</button>
    </div>`;
}

function saveHighlight(dayId) {
  const el = document.getElementById(`highlight-${dayId}`);
  if (!el || !DATA[dayId]) return;
  DATA[dayId].highlight = el.value.trim();
  saveData(DATA);
  saveDayToFirestore(dayId);
  showToast(`${DAYS.find(d => d.id === dayId).label} highlight saved`);
}

function renderDayView() {
  const box = document.getElementById('dayView');
  if (!box) return;
  const d = DAYS.find(x => x.id === getViewDay());
  const rec = DATA[d.id];
  box.innerHTML = rec
    ? metricStripHtml(rec, d.label) + photoStripHtml(d.id, rec) + highlightHtml(d.id, rec)
    : `<div class="no-data-inline">Belum ada data ${d.label}. Isi form di bawah untuk memulai.</div>`;
}

/* ---------------- RENDER: INPUT DATA PANEL (Day 1-4) ---------------- */

function renderDayPanel(dayId) {
  const dayIndex = DAYS.findIndex(d => d.id === dayId);
  const record = DATA[dayId];
  const panel = document.getElementById(`panel-${dayId}`);
  if (!panel) return;

  const prevDetails = panel.querySelector('.edit-panel');
  const wasOpen = prevDetails ? prevDetails.open : !record;

  const visibleDays = DAYS.slice(0, dayIndex + 1).filter(d => DATA[d.id]);
  const chartLabels = visibleDays.map(d => d.label);
  const demoBadge = isDemoMode() && visibleDays.length ? `<span class="demo-badge">DEMO DATA</span>` : '';

  const chartsHtml = visibleDays.length > 0 ? `
    <div class="chart-box chart-box-main">
      <h3>EVENT METRICS</h3>
      <div class="chart-canvas-wrap chart-canvas-wrap-main"><canvas id="${dayId}CombinedChart"></canvas></div>
    </div>
  ` : `<div class="no-data-inline">Belum ada data untuk ditampilkan pada grafik. Isi form di bawah untuk memulai.</div>`;

  panel.innerHTML = `
    <div class="day-panel-header">
      <h2 class="panel-title" style="margin:0;">INPUT DATA — DAY 1–4</h2>
      ${demoBadge}
    </div>

    ${chartsHtml}
    <div class="day-view-bar">
      <select id="dayViewSelect" class="day-view-select" aria-label="Pilih hari">
        ${DAYS.map(d => `<option value="${d.id}" ${d.id === getViewDay() ? 'selected' : ''}>${d.label}</option>`).join('')}
      </select>
    </div>
    <div id="dayView"></div>

    <details class="edit-panel" ${wasOpen ? 'open' : ''}>
      <summary>INPUT / EDIT DATA DAY 1–4</summary>
      <div class="form-box">
        <p class="edit-panel-hint">Isi atau ubah data untuk Day 1–4 di satu tempat ini.</p>
        ${DAYS.map(d => dayFormSectionHtml(dayId, d)).join('')}
      </div>
    </details>`;

  DAYS.forEach(d => {
    const scope = `${dayId}-edit-${d.id}`;
    document.getElementById(`form-${scope}`).addEventListener('submit', (e) => {
      e.preventDefault();
      handleSave(scope, d.id);
    });
    FIELDS.forEach(f => {
      const input = document.getElementById(`${scope}-${f.key}`);
      input.addEventListener('input', () => validateField(input));
    });
  });

  document.getElementById('dayViewSelect').addEventListener('change', (e) => {
    selectedViewDay = e.target.value;
    renderDayView();
  });
  renderDayView();

  if (visibleDays.length > 0) {
    destroyChart(`${dayId}Combined`);
    charts[`${dayId}Combined`] = buildCombinedStackedChart(`${dayId}CombinedChart`, chartLabels, [
      { name: 'Booth Visitor', values: visibleDays.map(d => DATA[d.id].visitor), color: COLOR_VISITOR },
      { name: 'Serious Buyer', values: visibleDays.map(d => DATA[d.id].buyer), color: COLOR_BUYER },
      { name: 'Challenge Story', values: visibleDays.map(d => DATA[d.id].challenge), color: COLOR_CHALLENGE },
      { name: 'Follower IG', values: visibleDays.map(d => DATA[d.id].ig), color: COLOR_IG },
      { name: 'Follower TikTok', values: visibleDays.map(d => DATA[d.id].tiktok), color: COLOR_TIKTOK },
      { name: 'Follower FB', values: visibleDays.map(d => DATA[d.id].fb), color: COLOR_FB },
    ]);
  }
}

function dayFormSectionHtml(panelDayId, targetDay) {
  const rec = DATA[targetDay.id];
  const scope = `${panelDayId}-edit-${targetDay.id}`;
  const filled = rec ? 'day-form-section--filled' : '';
  return `
    <div class="day-form-section ${filled}">
      <div class="day-form-section-header">
        <h4>${targetDay.label}</h4>
        <span class="day-form-section-date">${targetDay.dateLabel}</span>
      </div>
      <form id="form-${scope}" novalidate>
        <div class="form-grid">
          ${FIELDS.map(f => fieldHtml(scope, f, rec)).join('')}
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">SAVE ${targetDay.label} DATA</button>
        </div>
      </form>
    </div>`;
}

function fieldHtml(scope, field, record) {
  const val = record ? record[field.key] : '';
  return `
    <div class="field">
      <label for="${scope}-${field.key}">${field.label}</label>
      <input type="number" min="0" step="1" inputmode="numeric"
             id="${scope}-${field.key}" value="${val}" placeholder="0">
      <span class="error" id="${scope}-${field.key}-error"></span>
    </div>`;
}

function validateField(input) {
  const raw = input.value.trim();
  const errorEl = document.getElementById(`${input.id}-error`);
  let msg = '';

  if (raw !== '') {
    const num = Number(raw);
    if (!Number.isFinite(num)) msg = 'Harus berupa angka';
    else if (num < 0) msg = 'Tidak boleh negatif';
    else if (!Number.isInteger(num)) msg = 'Tidak boleh desimal';
  }

  input.classList.toggle('invalid', !!msg);
  errorEl.textContent = msg;
  return msg === '';
}

function handleSave(scope, targetDayId) {
  let allValid = true;
  const record = {};

  FIELDS.forEach(f => {
    const input = document.getElementById(`${scope}-${f.key}`);
    if (!validateField(input)) allValid = false;
    const raw = input.value.trim();
    record[f.key] = raw === '' ? 0 : Math.floor(Number(raw));
  });

  if (!allValid) {
    showToast('Perbaiki input yang tidak valid');
    return;
  }

  record.photos = (DATA[targetDayId] && DATA[targetDayId].photos) || [null, null, null];
  record.highlight = (DATA[targetDayId] && DATA[targetDayId].highlight) || '';

  DATA[targetDayId] = record;
  clearDemoFlag();
  saveData(DATA);
  saveDayToFirestore(targetDayId);
  showToast(`${DAYS.find(d => d.id === targetDayId).label} data saved`);

  renderDayPanel(INPUT_TAB);
}

/* ---------------- CHART BUILDERS ---------------- */

function daysWithData() {
  return DAYS.filter(d => DATA[d.id]);
}

function destroyChart(id) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
}

function chartBaseOptions(extra) {
  return Object.assign({
    responsive: true,
    maintainAspectRatio: false,
    layout: { padding: { top: 24 } },
    plugins: {
      legend: { display: false },
      datalabels: {
        anchor: 'end',
        align: 'top',
        color: '#1c2b36',
        font: { weight: '700', size: 12 },
        formatter: (v) => v,
      }
    },
    scales: {
      y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#eef1f4' } },
      x: { grid: { display: false } }
    }
  }, extra || {});
}

function buildSingleMultiColorChart(canvasId, labels, values, colors) {
  if (!LIBS_OK) return null;
  const el = document.getElementById(canvasId);
  if (!el) return null;
  return new Chart(el, {
    type: 'bar',
    data: {
      labels,
      datasets: [{ data: values, backgroundColor: colors, borderRadius: 4, maxBarThickness: 70 }]
    },
    options: chartBaseOptions()
  });
}

function hexToRgba(hex, alpha) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

/** Plugin: menggambar total tiap bar di atas segmen paling atas. */
const stackTotalPlugin = {
  id: 'stackTotalLabel',
  afterDatasetsDraw(chart) {
    const { ctx } = chart;
    const nBars = (chart.data.labels || []).length;
    for (let idx = 0; idx < nBars; idx++) {
      const total = chart.data.datasets.reduce((sum, ds) => sum + (ds.data[idx] || 0), 0);
      let topMeta = chart.getDatasetMeta(0);
      for (let i = chart.data.datasets.length - 1; i >= 0; i--) {
        if (chart.data.datasets[i].data[idx] > 0) { topMeta = chart.getDatasetMeta(i); break; }
      }
      const bar = topMeta.data[idx];
      if (!bar) continue;
      ctx.save();
      ctx.font = '700 13px sans-serif';
      ctx.fillStyle = '#1c2b36';
      ctx.textAlign = 'center';
      ctx.fillText(`Total: ${total}`, bar.x, bar.y - 12);
      ctx.restore();
    }
  }
};

/** Satu bar per metrik, tiap bar di-stack per hari. */
function buildCombinedStackedChart(canvasId, dayLabels, metrics) {
  if (!LIBS_OK) return null;
  const el = document.getElementById(canvasId);
  if (!el) return null;
  const alphas = [1, 0.75, 0.55, 0.35];
  const datasets = dayLabels.map((label, dayIdx) => ({
    label,
    data: metrics.map(m => m.values[dayIdx] || 0),
    backgroundColor: metrics.map(m => hexToRgba(m.color, alphas[dayIdx % alphas.length])),
    borderRadius: dayIdx === dayLabels.length - 1 ? 4 : 0,
    maxBarThickness: 90,
    stack: 'total',
  }));
  return new Chart(el, {
    type: 'bar',
    data: { labels: metrics.map(m => m.name), datasets },
    options: chartBaseOptions({
      layout: { padding: { top: 32 } },
      plugins: {
        legend: { display: true, position: 'bottom' },
        datalabels: {
          color: (ctx) => (alphas[ctx.datasetIndex % alphas.length] > 0.6 ? '#fff' : '#1c2b36'),
          font: { weight: '700', size: 12 },
          formatter: (v) => v > 0 ? v : '',
        }
      },
      scales: {
        x: { stacked: true, grid: { display: false } },
        y: { stacked: true, beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#eef1f4' } }
      }
    }),
    plugins: [stackTotalPlugin]
  });
}

/* ---------------- EXPORT / IMPORT / RESET ---------------- */

function buildExportRows() {
  return DAYS.map(d => {
    const r = DATA[d.id] || { visitor: '', ig: '', tiktok: '', fb: '', buyer: '', challenge: '' };
    return {
      Day: d.label,
      Date: d.dateLabel,
      BoothVisitor: r.visitor,
      Instagram: r.ig,
      TikTok: r.tiktok,
      Facebook: r.fb,
      TotalFollower: r.visitor === '' ? '' : totalFollower(r),
      SeriousBuyer: r.buyer,
      ChallengeStory: r.challenge,
    };
  });
}

function exportCSV() {
  const rows = buildExportRows();
  const headers = Object.keys(rows[0]);
  const lines = [headers.join(',')];
  rows.forEach(r => lines.push(headers.map(h => r[h]).join(',')));
  downloadFile('iihe2026_booth_data.csv', lines.join('\n'), 'text/csv');
}

function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function importFromFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const text = e.target.result;
      let imported;
      if (file.name.toLowerCase().endsWith('.json')) {
        imported = JSON.parse(text);
      } else {
        imported = parseCSV(text);
      }
      applyImportedData(imported);
    } catch (err) {
      showToast('Import gagal: format file tidak valid');
    }
  };
  reader.readAsText(file);
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim());
  const result = {};
  const dayMap = { 'DAY 1': 'day1', 'DAY 2': 'day2', 'DAY 3': 'day3', 'DAY 4': 'day4' };

  for (let i = 1; i < lines.length; i++) {
    const cells = lines[i].split(',').map(c => c.trim());
    const row = {};
    headers.forEach((h, idx) => row[h] = cells[idx]);
    const dayId = dayMap[row.Day];
    if (!dayId || row.BoothVisitor === '' || row.BoothVisitor === undefined) continue;
    result[dayId] = {
      visitor: Number(row.BoothVisitor) || 0,
      ig: Number(row.Instagram) || 0,
      tiktok: Number(row.TikTok) || 0,
      fb: Number(row.Facebook) || 0,
      buyer: Number(row.SeriousBuyer) || 0,
      challenge: Number(row.ChallengeStory) || 0,
    };
  }
  return result;
}

function applyImportedData(imported) {
  const importedIds = [];
  let count = 0;
  DAYS.map(d => d.id).forEach(id => {
    const r = imported[id];
    if (!r) return;
    const clean = {};
    FIELDS.forEach(f => {
      const num = Number(r[f.key]);
      clean[f.key] = Number.isFinite(num) && num >= 0 ? Math.floor(num) : 0;
    });
    clean.photos = (DATA[id] && DATA[id].photos) || [null, null, null];
    clean.highlight = (DATA[id] && DATA[id].highlight) || '';
    DATA[id] = clean;
    importedIds.push(id);
    count++;
  });

  if (count === 0) {
    showToast('Tidak ada data valid untuk diimpor');
    return;
  }

  clearDemoFlag();
  saveData(DATA);
  importedIds.forEach(id => saveDayToFirestore(id));
  renderAll();
  showToast(`Import berhasil (${count} hari)`);
}

function resetAllData() {
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(DEMO_FLAG_KEY);
  DATA = { day1: null, day2: null, day3: null, day4: null };
  saveData(DATA);
  clearFirestoreData();
  renderAll();
  showToast('Semua data telah direset');
}

/* ---------------- TOAST ---------------- */

let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ---------------- LIBRARY LOAD CHECK ---------------- */

function showLibWarningIfNeeded() {
  if (LIBS_OK) return;
  const banner = document.createElement('div');
  banner.style.cssText =
    'background:#fdecea;color:#c0392b;border:1px solid #f5c6cb;' +
    'padding:14px 16px;margin:0 0 16px;border-radius:8px;font-size:13px;' +
    'line-height:1.5;max-width:1000px;margin-left:auto;margin-right:auto;';
  banner.innerHTML =
    '<strong>⚠️ Grafik tidak bisa ditampilkan.</strong><br>' +
    'Library Chart.js gagal dimuat dari jsDelivr (cek koneksi internet). ' +
    'Input data, edit, export/import, dan reset tetap berfungsi tanpa grafik.';
  document.body.insertBefore(banner, document.body.firstChild);
}

/* ---------------- INIT ---------------- */

function renderAll() {
  renderDayPanel(INPUT_TAB);
}

async function init() {
  showLibWarningIfNeeded();
  await loadPhotosFromFirestore();
  await loadDataFromFirestore();
  renderAll();

  document.getElementById('btnExport').addEventListener('click', exportCSV);

  document.getElementById('importFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) importFromFile(file);
    e.target.value = '';
  });

  document.getElementById('btnReset').addEventListener('click', () => {
    document.getElementById('resetModal').classList.add('active');
  });
  document.getElementById('btnCancelReset').addEventListener('click', () => {
    document.getElementById('resetModal').classList.remove('active');
  });
  document.getElementById('btnConfirmReset').addEventListener('click', () => {
    document.getElementById('resetModal').classList.remove('active');
    resetAllData();
  });

}

document.addEventListener('DOMContentLoaded', init);
</script>
